<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nosum</title>
    <base href="/" />
    <!-- The tomato of assets/sprites/items.png (ObjectIcon 33), cut as a 16, 32 and 48 px ICO. -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon" />
    <!-- Page behaviour of a game and the device signals; first, so it also covers the boot screen (wasm/README.md). -->
    <script src="page-guard.js"></script>
    <!-- The UI theme: variables, then the sprite cutter (docs/adr/ADR-016); the controls' scoped CSS comes with Nosum.Wasm.styles.css. -->
    <link rel="stylesheet" href="_content/Nosum.Wasm.Controls/nosum-theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Scoped CSS of the app's components (e.g. AccountForm.razor.css, SessionBar.razor.css). -->
    <link href="Nosum.Wasm.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script type="module" src="_content/Nosum.Wasm.Controls/nosum-theme.js"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-title">Nosum</div>
            <div class="boot-bar"><i></i></div>
            <div class="boot-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Started by hand so the satellite resources (Language.en.resx) are downloaded: the account's language is only known after sign-in (docs/adr/ADR-010 D6). -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        (function () {
            window.nosumSw = { _reg: null, _regPromise: null };
            if (window.caches && caches.keys) {
                caches.keys().then(function (keys) {
                    keys.forEach(function (k) {
                        if (k.indexOf('offline-cache-') === 0) {
                            caches.delete(k);
                        }
                    });
                }).catch(function () {});
            }
            if (!('serviceWorker' in navigator)) { return; }
            var hadController = !!navigator.serviceWorker.controller;
            var reloadRequested = false;
            // A new worker waits until the player asks for it (the banner below). A reload that happens on its own would lose unsaved game
            // state mid-game (issue #161), so the page reloads only after the player confirmed.
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!hadController || !reloadRequested) { return; }
                window.__nosumSwReload = true;
                location.reload();
            });
            function showUpdateBanner(reg) {
                if (document.getElementById('nosum-update')) { return; }
                var en = (navigator.language || '').toLowerCase().indexOf('en') === 0;
                var bar = document.createElement('div');
                bar.id = 'nosum-update';
                bar.setAttribute('role', 'status');
                bar.style.cssText = 'position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:10000;display:flex;gap:12px;align-items:center;'
                    + 'background:#2b2118;color:#fff;font:14px/1.4 system-ui,sans-serif;padding:8px 14px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.4);';
                var text = document.createElement('span');
                text.textContent = en
                    ? 'Update available. Save your progress, then reload to get the latest version.'
                    : 'Có bản cập nhật. Hãy lưu tiến trình rồi tải lại để dùng phiên bản mới.';
                var button = document.createElement('button');
                button.type = 'button';
                button.textContent = en ? 'Reload' : 'Tải lại';
                button.style.cssText = 'font:inherit;padding:4px 10px;cursor:pointer;';
                button.addEventListener('click', function () {
                    reloadRequested = true;
                    if (reg.waiting) {
                        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    } else {
                        window.__nosumSwReload = true;
                        location.reload();
                    }
                });
                bar.appendChild(text);
                bar.appendChild(button);
                document.body.appendChild(bar);
            }
            function watchForUpdate(reg) {
                if (reg.waiting && hadController) { showUpdateBanner(reg); }
                reg.addEventListener('updatefound', function () {
                    var worker = reg.installing;
                    if (!worker) { return; }
                    worker.addEventListener('statechange', function () {
                        if (worker.state === 'installed' && navigator.serviceWorker.controller) { showUpdateBanner(reg); }
                    });
                });
            }
            var regPromise = navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
            window.nosumSw._regPromise = regPromise;
            regPromise.then(function (reg) { window.nosumSw._reg = reg; watchForUpdate(reg); }).catch(function () {});
            navigator.serviceWorker.ready.then(function (reg) {
                var fireWarm = function () {
                    if (reg.active) {
                        reg.active.postMessage({ type: 'WARM_OFFLINE_CACHE' });
                    }
                };
                if ('requestIdleCallback' in window) {
                    requestIdleCallback(fireWarm, { timeout: 5000 });
                } else {
                    setTimeout(fireWarm, 3000);
                }
            }).catch(function () {});
        })();
        // Boot progress (before .NET starts, so no .resx): every boot resource is counted when Blazor requests it and again when it arrives.
        // The label is Vietnamese unless the browser asks for English.
        var bootLoad = (function () {
            var en = (navigator.language || '').toLowerCase().indexOf('en') === 0;
            var label = en ? 'Loading' : 'Đang tải';
            var requested = 0;
            var arrived = 0;
            var root = document.documentElement.style;
            // The failure is named for the console; a stale page is replaced first (recoverFromStaleBoot, declared below).
            function refuse(message) {
                recoverFromStaleBoot();
                return new Error(message);
            }
            var text = document.querySelector('.boot-text');
            function show() {
                var pct = requested ? Math.floor(arrived * 100 / requested) : 0;
                root.setProperty('--nosum-boot-progress', pct + '%');
                if (text) { text.textContent = label + '… ' + pct + '%'; }
            }
            show();
            return function (type, name, defaultUri, integrity) {
                // The runtime imports its JavaScript modules by URL, so those keep the default loader (undefined); the manifest is not counted.
                if (type === 'dotnetjs') { return undefined; }
                var counted = type !== 'manifest';
                if (counted) { requested++; show(); }
                return fetch(defaultUri, { cache: 'no-cache', integrity: integrity }).then(function (response) {
                    // A file the deploy does not have comes back as the host's index page (Cloudflare Pages answers 200 text/html). Refuse it here, by
                    // name, instead of letting the runtime try to compile HTML and stop part way (the bar stalls at its last percentage).
                    var html = (response.headers.get('Content-Type') || '').indexOf('text/html') !== -1;
                    if (!response.ok || html) {
                        throw refuse('Could not load ' + name + ' (HTTP ' + response.status + (html ? ', page instead of file' : '') + ').');
                    }
                    if (counted) { arrived++; show(); }
                    return response;
                }, function (error) {
                    // The integrity check runs inside fetch, so a missing file fails here, not above: name it for the console too.
                    throw refuse('Could not load ' + name + ': ' + (error && error.message ? error.message : error));
                });
            };
        })();
        // A page the service worker serves can hold the shell of an older deploy whose files are gone: the one fix is the current build, so the
        // worker and its cache are dropped and the page reloaded, once per tab session (the guard stops a loop when the file really is missing).
        function recoverFromStaleBoot() {
            try {
                if (!navigator.serviceWorker || !navigator.serviceWorker.controller || navigator.onLine === false) { return; }
                var key = 'nosum-boot-recover';
                if (sessionStorage.getItem(key)) { return; }
                sessionStorage.setItem(key, '1');
                navigator.serviceWorker.getRegistration().then(function (reg) {
                    return reg ? reg.unregister() : null;
                }).catch(function () {}).then(function () {
                    return window.caches && caches.keys ? caches.keys().then(function (keys) {
                        return Promise.all(keys.filter(function (k) {
                            return k.indexOf('nosum-offline-cache-') === 0 || k.indexOf('offline-cache-') === 0;
                        }).map(function (k) { return caches.delete(k); }));
                    }) : null;
                }).catch(function () {}).then(function () {
                    window.__nosumSwReload = true;
                    location.reload();
                });
            } catch (e) {}
        }
        Blazor.start({ loadBootResource: bootLoad, configureRuntime: dotnet => { dotnet.withConfig({ loadAllSatelliteResources: true }); } }).catch(recoverFromStaleBoot);
    </script>
</body>

</html>
