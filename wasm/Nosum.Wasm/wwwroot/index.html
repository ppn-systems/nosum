<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nosum</title>
    <base href="/" />
    <!-- Page behaviour of a game and the device signals; first, so it also covers the boot screen (wasm/README.md). -->
    <script src="page-guard.js"></script>
    <!-- The UI theme: variables, then the sprite cutter (docs/adr/ADR-016); the controls' scoped CSS comes with Nosum.Wasm.styles.css. -->
    <link rel="stylesheet" href="_content/Nosum.Wasm.Controls/nosum-theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Scoped CSS of the app's components (e.g. AccountForm.razor.css, SessionBar.razor.css). -->
    <link href="Nosum.Wasm.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script type="module" src="_content/Nosum.Wasm.Controls/nosum-theme.js"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-title">Nosum</div>
            <div class="boot-bar"><i></i></div>
            <div class="boot-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Started by hand so the satellite resources (Language.en.resx) are downloaded: the account's language is only known after sign-in (docs/adr/ADR-010 D6). -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        (function () {
            window.nosumSw = { _reg: null, _regPromise: null };
            if (window.caches && caches.keys) {
                caches.keys().then(function (keys) {
                    keys.forEach(function (k) {
                        if (k.indexOf('offline-cache-') === 0) {
                            caches.delete(k);
                        }
                    });
                }).catch(function () {});
            }
            if (!('serviceWorker' in navigator)) { return; }
            var hadController = !!navigator.serviceWorker.controller;
            var reloadedForController = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!hadController || reloadedForController) { return; }
                reloadedForController = true;
                window.__nosumSwReload = true;
                location.reload();
            });
            var regPromise = navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
            window.nosumSw._regPromise = regPromise;
            regPromise.then(function (reg) { window.nosumSw._reg = reg; }).catch(function () {});
            navigator.serviceWorker.ready.then(function (reg) {
                var fireWarm = function () {
                    if (reg.active) {
                        reg.active.postMessage({ type: 'WARM_OFFLINE_CACHE' });
                    }
                };
                if ('requestIdleCallback' in window) {
                    requestIdleCallback(fireWarm, { timeout: 5000 });
                } else {
                    setTimeout(fireWarm, 3000);
                }
            }).catch(function () {});
        })();
        // Boot progress (before .NET starts, so no .resx): every boot resource is counted when Blazor requests it and again when it arrives.
        // The label is Vietnamese unless the browser asks for English.
        var bootLoad = (function () {
            var en = (navigator.language || '').toLowerCase().indexOf('en') === 0;
            var label = en ? 'Loading' : 'Đang tải';
            var requested = 0;
            var arrived = 0;
            var root = document.documentElement.style;
            var text = document.querySelector('.boot-text');
            function show() {
                var pct = requested ? Math.floor(arrived * 100 / requested) : 0;
                root.setProperty('--nosum-boot-progress', pct + '%');
                if (text) { text.textContent = label + '… ' + pct + '%'; }
            }
            show();
            return function (type, name, defaultUri, integrity) {
                // The runtime imports its JavaScript modules by URL, so those keep the default loader (undefined); the manifest is not counted.
                if (type === 'dotnetjs') { return undefined; }
                var counted = type !== 'manifest';
                if (counted) { requested++; show(); }
                return fetch(defaultUri, { cache: 'no-cache', integrity: integrity }).then(function (response) {
                    if (counted) { arrived++; show(); }
                    return response;
                });
            };
        })();
        Blazor.start({ loadBootResource: bootLoad, configureRuntime: dotnet => { dotnet.withConfig({ loadAllSatelliteResources: true }); } }).catch(function (reason) {
            try {
                if (!navigator.serviceWorker || !navigator.serviceWorker.controller || navigator.onLine === false) { return; }
                var key = 'nosum-boot-recover';
                if (sessionStorage.getItem(key)) { return; }
                sessionStorage.setItem(key, '1');
                navigator.serviceWorker.getRegistration().then(function (reg) {
                    return reg ? reg.unregister() : null;
                }).catch(function () {}).then(function () {
                    return window.caches && caches.keys ? caches.keys().then(function (keys) {
                        return Promise.all(keys.filter(function (k) {
                            return k.indexOf('nosum-offline-cache-') === 0 || k.indexOf('offline-cache-') === 0;
                        }).map(function (k) { return caches.delete(k); }));
                    }) : null;
                }).catch(function () {}).then(function () {
                    window.__nosumSwReload = true;
                    location.reload();
                });
            } catch (e) {}
        });
    </script>
</body>

</html>
