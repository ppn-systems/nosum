# Production deployment of one server (docs/adr/ADR-041, ADR-031 D1-D4): PostgreSQL 16, the Nosum host, a Cloudflare Tunnel connector and the nightly backup.
# The web client is not here: it is on Cloudflare Pages (docs/adr/ADR-041 D4). Nothing listens on the internet; the tunnel dials out.
#
# Images are pulled from GHCR (built and deployed by .github/workflows/deploy-server.yml, which writes deploy/.env on the host).
# By hand, on the host:
#   docker compose --env-file .env -f compose.yaml up -d
#
# Operations (first start, tunnel, backup, restore, rollback, key rotation): docs/ops/README.md.
name: nosum

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # No `ports:`: PostgreSQL is reachable only on the compose network.
    environment:
      POSTGRES_DB: nosum
      POSTGRES_USER: nosum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nosum -d nosum"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [nosum]

  host:
    image: ghcr.io/ppn-systems/nosum-host:${NOSUM_TAG:?set NOSUM_TAG in deploy/.env (the commit SHA the workflow deploys)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nosum;Username=nosum;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # The page the players load (Cloudflare Pages). The server refuses WebSocket handshakes from any other web origin (CSWSH).
      NOSUM_ORIGIN: ${NOSUM_ORIGIN:?set NOSUM_ORIGIN in deploy/.env (the Pages address, for example https://nosum.pages.dev)}
      # The tunnel connector is the only peer that reaches the host from the network; its X-Forwarded-For is trusted.
      NOSUM_TRUSTED_PROXIES: 172.28.0.0/24
      NOSUM_CALENDAR_EPOCH: ${NOSUM_CALENDAR_EPOCH:-}
    volumes:
      # The Nalix server key, server.ini and block lists: losing this volume changes the server key, and every pinned client then refuses the server (docs/ops/README.md, "Rotate keys").
      - nalix_data:/data
    # The game WebSocket (57300) is published to this machine's loopback only, for debugging on the host. Players come through the tunnel.
    # The ops port (57301: health, metrics) is not published at all; the image binds it to localhost.
    ports:
      - "127.0.0.1:57300:57300"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [nosum]

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-2026.10.3}
    restart: unless-stopped
    # Dials out to Cloudflare and forwards the public hostname to http://host:57300 (the public hostname is set in the dashboard, docs/ops/README.md).
    # The token comes from deploy/.env; cloudflared reads it from TUNNEL_TOKEN, so it never appears on a command line.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env (the token of the tunnel nosum-api)}
    depends_on:
      host:
        condition: service_healthy
    # No `ports:`: the connector accepts no inbound connections.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [nosum]

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: nosum
      PGDATABASE: nosum
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      BACKUP_DIR: /backups
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/backup/backup.sh"]
    volumes:
      - ./backup:/backup:ro
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "/backup/backup.sh --check"]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 1h
    networks: [nosum]

networks:
  nosum:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  db_data:
  nalix_data:
  backups:
